19408671,62.34542442424996],[6.7712466057164775,62.345352753505445],[6.771151951266443,62.34527445781483],[6.771079581555351,62.34520567875792],[6.7710240128239505,62.34514481087505],[6.770951616945786,62.34506336952777],[6.770895077821082,62.34499215005774],[6.770855093948462,62.34493215148071],[6.770776550613946,62.34481379351404]],[[6.7738114588503375,62.34593731672494],[6.773801853310828,62.3459336404302],[6.773728567556723,62.34590867950086],[6.773645070437112,62.34588281873007],[6.773555955703268,62.34586002894416],[6.773440365539245,62.3458347319406],[6.773296454990579,62.3458083618554],[6.773172301289937,62.3457891327066],[6.773015742305766,62.345769205023096],[6.772857765614512,62.34575016144002],[6.772684200264552,62.34573551969094],[6.7725066615343135,62.345724962848685],[6.772324892408899,62.345716744664216],[6.772166930557333,62.34571314611269],[6.772060279660121,62.3457106207005],[6.771962477269418,62.345706009904895],[6.771909677707063,62.345701563166685],[6.771867377574591,62.34569621597797],[6.771809759620269,62.345686402800084],[6.771761903160103,62.34567521937442],[6.7717213854989895,62.3456640726789],[6.771690470365202,62.34565369942475]],[[6.771589653120885,62.34560403233307],[6.771505751371938,62.34555240015779],[6.771453203503381,62.34551851187078]],[[6.771690470365202,62.34565369942475],[6.7716633087656035,62.34564220991709],[6.771624920214963,62.34562319490639],[6.771589653120885,62.34560403233307]]]},"dato":"10.11.2026","navn":false};
const STATUS = {
  ferdig:  ["Ferdig bygget", "var(--ferdig)"],
  bygging: ["Bygging pågår", "var(--bygging)"],
  ikkeig:  ["Ikke igangsatt (ikke IG)", "var(--ikkeig)"],
  ukjent:  ["I eierlisten, status ikke oppgitt", "var(--ukjent)"],
  ingen:   ["Fradelt, ikke i eierlisten", "var(--ingen)"],
  plan:    ["Ikke fradelt / ikke solgt (tomtedelingsplanen)", "var(--ingen)"],
  grunn:   ["Grunneiendom / restareal", "var(--grunn)"],
};
const farge = s => getComputedStyle(document.documentElement).getPropertyValue(STATUS[s][1].slice(4,-1)).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const seeiendom = t => `https://seeiendom.kartverket.no/eiendom/1528/29/${t.bnr}/0/${t.snr}`;
document.getElementById("dato").textContent = DATA.dato;

const kart = L.map("kart", {zoomControl:true});
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom:20, maxNativeZoom:19,
  attribution:"Flyfoto: Esri, Maxar, Earthstar Geographics · Tomter: Kartverket · Veg: NVDB"
}).addTo(kart);
L.geoJSON(DATA.felt, {style:{color:"#fff", weight:1.5, dashArray:"6 6", fill:false}, interactive:false}).addTo(kart);

function popup(t) {
  if (t.status === "plan") return `<div class="popup"><h3>Ikke fradelt tomt</h3>
  <table><tr><td>Status</td><td><b>Ikke fradelt / ikke solgt</b></td></tr>
  <tr><td>Areal</td><td>ca. ${t.areal.toLocaleString("nb-NO")} m²</td></tr></table>
  <i>Fra tomtedelingsplanen for hele feltet (Møre Tekniske, 20.12.2021). Plassering ca.</i></div>`;
  const eiere = DATA.navn && t.eiere && t.eiere.length
    ? `<tr><td>${t.eiere.length > 1 ? "Eiere" : "Eier"}</td><td>${t.eiere.map(e => esc(e[0]) + (e[1] ? ` <i>(${e[1]})</i>` : "")).join("<br>")}</td></tr>` : "";
  return `<div class="popup"><h3>${esc(t.mnr)}${t.adr.length ? " · " + esc(t.adr.join(", ")) : ""}</h3>
  <table>
    <tr><td>Status</td><td><b>${STATUS[t.status][0]}</b>${t.usikker ? "<br><i>Usikker kobling i eierlisten</i>" : ""}</td></tr>
    ${t.antall > 1 ? `<tr><td>Enheter</td><td>${t.antall} i eierlisten</td></tr>` : ""}
    ${eiere}
    <tr><td>Areal</td><td>ca. ${t.areal.toLocaleString("nb-NO")} m²</td></tr>
  </table>
  <a href="${seeiendom(t)}" target="_blank" rel="noopener">Se eier og eiendom hos Kartverket</a></div>`;
}

const lag = {};
const alleLag = L.featureGroup().addTo(kart);
const stil = (t, vis) => {
  const grunn = t.status === "grunn", ledig = t.status === "ingen" || t.status === "plan";
  return {color: grunn ? "#fff" : "#000", weight: grunn ? 1 : ledig ? 2.4 : 1.2, dashArray: grunn ? "3 4" : null,
          fillColor: farge(t.status), fillOpacity: !vis ? 0.03 : grunn ? 0.05 : ledig ? 0.2 : 0.6, opacity: vis ? 1 : 0.15};
};
for (const t of DATA.tomter) {
  const l = L.geoJSON(t.geo, {style: stil(t, true)}).bindPopup(() => popup(t), {maxWidth:340});
  if (t.status !== "grunn" && t.status !== "plan") l.bindTooltip(String(t.bnr), {permanent:true, direction:"center", className:"bnr"});
  l.on("click", () => vel(t.id, false));
  l.addTo(alleLag);
  lag[t.id] = l;
}
L.geoJSON(DATA.v7, {style:{color:"#ea4f3d", weight:4, opacity:.8}, interactive:false}).addTo(kart);
const start = L.featureGroup(DATA.tomter.filter(t => t.status !== "grunn").map(t => lag[t.id])).getBounds();
DATA.tomter.filter(t => t.status !== "plan" && t.status !== "grunn").forEach(t => lag[t.id].bringToFront());
kart.fitBounds(start, {padding:[16,16]});
window.addEventListener("load", () => { kart.invalidateSize(); kart.fitBounds(start, {padding:[16,16]}); });

const selS = document.getElementById("status"), sok = document.getElementById("sok");
for (const [k, v] of Object.entries(STATUS)) selS.add(new Option(v[0], k));
document.getElementById("forklaring").innerHTML =
  Object.entries(STATUS).map(([k, v]) => `<div class="f"><span class="prikk" style="background:${v[1]}"></span>${v[0]}</div>`).join("") +
  `<div class="f"><span style="width:18px;height:0;border-top:4px solid #ea4f3d"></span>V7. Hvit stiplet linje: hyttefeltet F26A.</div>
   <div>Tomter med tykk svart strek er ikke solgt. Tomtene uten nummer er ikke fradelt ennå og er hentet fra tomtedelingsplanen for hele feltet (Møre Tekniske, 20.12.2021). Plasseringen er ca.</div>
   <div>Tallet på tomta er bruksnummeret (gnr. 29). ${DATA.navn ? "Navn fra foreningens eierliste." : "Eiere vises ikke her. Trykk på en tomt for lenke til Kartverket, der eieren kan sees."} Tomtegrensene er hentet fra matrikkelen og kan avvike noe fra terrenget.</div>`;

function passar(t) {
  const q = sok.value.trim().toLowerCase().replace(/\s+/g, " ");
  if (selS.value && t.status !== selS.value) return false;
  if (!q) return true;
  const m = q.match(/^(?:29\s*[\/ ]\s*)?(\d+)$/);
  if (m) return String(t.bnr) === m[1];
  return t.adr.some(a => a.toLowerCase().includes(q)) || t.mnr.toLowerCase().includes(q) ||
    (DATA.navn && (t.eiere || []).some(e => e[0].toLowerCase().includes(q)));
}

function vel(id, zoom) {
  document.querySelectorAll(".tomt").forEach(e => e.classList.toggle("valt", e.dataset.id == id));
  const e = document.querySelector(`.tomt[data-id="${id}"]`);
  if (e) e.scrollIntoView({block:"nearest"});
  if (zoom) { kart.fitBounds(lag[id].getBounds(), {maxZoom:18}); lag[id].openPopup(); }
}

function teikn() {
  const vis = DATA.tomter.filter(passar);
  for (const t of DATA.tomter) lag[t.id].setStyle(stil(t, vis.includes(t)));
  document.getElementById("liste").innerHTML = vis.filter(t => (t.status !== "grunn" && t.status !== "plan") || selS.value === t.status || vis.length < 5).map(t => `
    <div class="tomt" data-id="${t.id}">
      <span class="prikk" style="background:${STATUS[t.status][1]}"></span>
      <div><b>${esc(t.mnr)}</b>${t.adr.length ? " · " + esc(t.adr[0]) : ""}
        <div class="sm">${STATUS[t.status][0]}${DATA.navn && t.eiere && t.eiere.length ? " · " + t.eiere.map(e => esc(e[0])).join("; ") : ""}</div></div>
    </div>`).join("");
  document.querySelectorAll(".tomt").forEach(e => e.onclick = () => vel(+e.dataset.id, true));
  const n = s => vis.filter(t => t.status === s).length;
  document.getElementById("tal").textContent =
    `${vis.filter(t => t.status !== "grunn" && t.status !== "plan").length} fradelte tomter · ${n("ferdig")} ferdig bygget · ${n("bygging")} under bygging · ${n("ikkeig")} ikke igangsatt · ${n("ingen") + n("plan")} ikke solgt (${n("plan")} ikke fradelt)`;
  if (vis.length === 1) vel(vis[0].id, true);
}
[sok, selS].forEach(e => e.addEventListener("input", teikn));
teikn();
</script>
